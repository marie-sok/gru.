<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030505"/>
      <stop offset="0.55" stop-color="#07100D"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- subtle chat-like background doodles -->
  <g fill="none" stroke="#78FFD0" stroke-width="1.2" opacity="0.08" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 135h52a14 14 0 0 1 14 14v14H48l-12 10v-10h-8z"/>
    <path d="M298 132h54a14 14 0 0 1 14 14v17h-39l-11 9v-9h-18z"/>
    <path d="M36 645h47a12 12 0 0 1 12 12v14H59l-12 9v-9H36z"/>
    <path d="M299 626h47a12 12 0 0 1 12 12v14h-29l-11 9v-9h-19z"/>
    <circle cx="62" cy="252" r="4"/><circle cx="329" cy="271" r="4"/>
    <path d="M46 526c0-9 13-10 13 0 0-10 13-9 13 0 0 9-13 17-13 17s-13-8-13-17z"/>
    <path d="M319 502c0-9 13-10 13 0 0-10 13-9 13 0 0 9-13 17-13 17s-13-8-13-17z"/>
  </g>

  <!-- brand -->
  <text x="28" y="56" fill="#F4F7F6" font-family="-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif" font-size="25" font-weight="800">gru.</text>
  <circle cx="87" cy="49" r="3" fill="#78FFD0"/>

  <!-- tiny lock accent -->
  <g transform="translate(334 34)" fill="none" stroke="#78FFD0" stroke-width="1.8" opacity="0.9">
    <rect x="0" y="9" width="18" height="16" rx="5"/>
    <path d="M4 9V6a5 5 0 0 1 10 0v3"/>
  </g>

  <!-- neon GRU cat, intentionally simple -->
  <g transform="translate(195 305)" filter="url(#softGlow)">
    <path d="M-58-52 L-48-92 L-17-63 M58-52 L48-92 L17-63" fill="#06100D" stroke="#78FFD0" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-35" rx="70" ry="57" fill="#06100D" stroke="#78FFD0" stroke-width="2.6"/>
    <path d="M-60 15 Q-72 46-64 82 Q0 107 64 82 Q72 46 60 15 Q0 34-60 15z" fill="#06100D" stroke="#78FFD0" stroke-width="2.6"/>

    <!-- shrug arms -->
    <path d="M-55 31 C-84 38-102 52-115 68" fill="none" stroke="#78FFD0" stroke-width="9" stroke-linecap="round"/>
    <path d="M55 31 C84 38 102 52 115 68" fill="none" stroke="#78FFD0" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-121" cy="72" r="15" fill="#06100D" stroke="#B8A1FF" stroke-width="2.4"/>
    <circle cx="121" cy="72" r="15" fill="#06100D" stroke="#B8A1FF" stroke-width="2.4"/>
    <g fill="#B8A1FF">
      <circle cx="-121" cy="74" r="4.8"/><circle cx="-128" cy="66" r="2.8"/><circle cx="-114" cy="65" r="2.8"/>
      <circle cx="121" cy="74" r="4.8"/><circle cx="114" cy="66" r="2.8"/><circle cx="128" cy="65" r="2.8"/>
    </g>

    <!-- face -->
    <ellipse cx="-25" cy="-39" rx="8" ry="11" fill="#78FFD0"/>
    <ellipse cx="-25" cy="-39" rx="3.6" ry="6.5" fill="#07110E"/>
    <path d="M20-40 Q31-46 41-38" fill="none" stroke="#78FFD0" stroke-width="3" stroke-linecap="round"/>
    <path d="M-3-15 l6 0 l-3 4z" fill="#B8A1FF"/>
    <path d="M0-10 v7 M0-3 Q-7 5-14 0 M0-3 Q7 5 14 0" fill="none" stroke="#B8A1FF" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M-38-9h-36 M-36 2h-41 M38-9h36 M36 2h41" stroke="#78FFD0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- hoodie wordmark -->
    <rect x="-35" y="47" width="70" height="27" rx="13.5" fill="#0A1512" stroke="#78FFD0" stroke-width="1.2"/>
    <text x="0" y="66" text-anchor="middle" fill="#F6F8F7" font-family="-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif" font-size="14" font-weight="800" letter-spacing="0.8">ШТОШ</text>
  </g>

  <!-- compact copy, styled like chat labels -->
  <text x="195" y="453" text-anchor="middle" fill="#78FFD0" font-family="-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif" font-size="25" font-weight="800">Упс…</text>
  <text x="195" y="479" text-anchor="middle" fill="#A9B8B3" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="600">this stays between us</text>

  <text x="195" y="539" text-anchor="middle" fill="#F7F9F8" font-family="-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif" font-size="25" font-weight="800">Частная жизнь имеет значение</text>

  <text x="195" y="578" text-anchor="middle" fill="#A7B2AE" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="500">
    <tspan x="195" dy="0">gru. уважает ценность частной жизни.</tspan>
    <tspan x="195" dy="21">Разговор между двумя людьми</tspan>
    <tspan x="195" dy="21">должен оставаться между ними.</tspan>
  </text>

  <!-- one restrained info line, no fake heavy card -->
  <g transform="translate(64 679)">
    <path d="M0 13 Q10 1 20 13 Q10 25 0 13z M3 4 L18 21" fill="none" stroke="#78FFD0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="34" y="10" fill="#CBD3D0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="600">Запись, трансляция и превью скрываются,</text>
    <text x="34" y="29" fill="#CBD3D0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="600">чтобы личный разговор оставался личным.</text>
  </g>

  <text x="195" y="790" text-anchor="middle" fill="#78FFD0" opacity="0.85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">gru. • people for people</text>
</svg>
