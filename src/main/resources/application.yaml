server:
  port: ${PORT:8081}
  address: 0.0.0.0

spring:
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 132MB

  docker:
    compose:
      enabled: false

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gru}


management:
  endpoints:
    web:
      exposure:
        include: health,info

gru:
  security:
    jwt-secret: ${GRU_JWT_SECRET:}
  moderation:
    blocked-terms: ${GRU_MODERATION_BLOCKED_TERMS:}
  public:
    support-email: ${GRU_SUPPORT_EMAIL:not-configured}
