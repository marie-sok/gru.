server:
  port: 8081

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/gru
    redis:
      host: redis
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

chat:
  cache:
    ttl-minutes: 10

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: INFO

kind: Application