name: Backend tests

on:
  push:
    branches:
      - beta/0.9.0
      - beta/0.9.1-max
      - verification
      - all-backand
  pull_request:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test backend
        run: mvn --batch-mode --no-transfer-progress clean test
