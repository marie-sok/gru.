name: DAST baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://gru-jiqi.onrender.com"
          fail_action: false
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"
          cmd_options: "-a -m 3 -I"
