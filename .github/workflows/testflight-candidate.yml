name: TestFlight candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 50

    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      TEAM_ID: M3LJSC49RD
      BUNDLE_ID: sok.com.gru

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Release hardening audit
        run: python3 scripts/release_hardening_audit.py

      - name: Runtime localization audit
        run: python3 scripts/localization_audit.py

      - name: Dual-client E2EE v2 crypto smoke
        run: xcrun swift .github/scripts/e2ee_v2_dual_client_smoke.swift

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_KEY_P8_BASE64 \
            DIST_CERT_P12_BASE64 \
            DIST_CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret backing $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install App Store signing material
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/gru-testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/gru-distribution.p12"
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN" \
            -P "$DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          echo "GRU_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "GRU_ASC_AUTH_KEY=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Create App Store export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive exact Release candidate
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/gru.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GRU_ASC_AUTH_KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive

      - name: Verify archived production transport
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/gru.xcarchive/Products/Applications/gru.app"
          test -d "$APP"

          HTTP_VALUE="$(/usr/libexec/PlistBuddy -c 'Print :GRUProductionHTTPBaseURL' "$APP/Info.plist")"
          WSS_VALUE="$(/usr/libexec/PlistBuddy -c 'Print :GRUProductionWebSocketURL' "$APP/Info.plist")"

          test "$HTTP_VALUE" = 'https://gru-edge-v2.onrender.com'
          test "$WSS_VALUE" = 'wss://gru-edge-v2.onrender.com/ws'

          echo "Verified Release HTTP: $HTTP_VALUE"
          echo "Verified Release WSS: $WSS_VALUE"

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/gru.xcarchive" \
            -exportPath "$RUNNER_TEMP/gru-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GRU_ASC_AUTH_KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA_PATH="$(find "$RUNNER_TEMP/gru-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          test -f "$IPA_PATH"
          echo "GRU_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload candidate to TestFlight
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$GRU_ASC_AUTH_KEY" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$GRU_IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/gru-distribution.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [ -n "${GRU_KEYCHAIN:-}" ] && [ -e "$GRU_KEYCHAIN" ]; then
            security delete-keychain "$GRU_KEYCHAIN" || true
          fi
