name: P0 security checks

on:
  pull_request:
    paths:
      - "src/**"
      - "swiftui/GRU/**"
      - ".github/workflows/p0-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate ephemeral CI JWT secret
        shell: bash
        run: echo "GRU_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run security regression tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=JwtChannelInterceptorTest,MediaControllerTest,E2EERecoveryControllerTest,E2EEKeyControllerTest,E2EECryptoVerifierTest
          test
