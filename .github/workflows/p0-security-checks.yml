name: P0 security checks

on:
  pull_request:
    paths:
      - "src/**"
      - "swiftui/GRU/**"
      - ".github/workflows/p0-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate ephemeral CI JWT secret
        shell: bash
        run: echo "GRU_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run security regression tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=JwtChannelInterceptorTest,MessageSocketControllerTest,MessageControllerSecurityTest,MediaControllerTest,E2EERecoveryControllerTest,E2EEKeyControllerTest,E2EECryptoVerifierTest,E2EEMessageServiceTwoClientTest
          test
      - name: Verify plaintext downgrade surfaces stay closed
        shell: bash
        run: |
          CONTROLLER="src/main/java/gru/app/controller/MessageController.java"
          SOCKET="src/main/java/gru/app/websocket/MessageSocketController.java"

          grep -F 'HttpStatus.UPGRADE_REQUIRED' "$CONTROLLER"
          grep -F 'Legacy plaintext STOMP message send is disabled' "$SOCKET"

          ! grep -F '@PostMapping(value = "/messages/photo"' "$CONTROLLER"
          ! grep -F '@PostMapping(value = "/messages/video"' "$CONTROLLER"
          ! grep -F '@PostMapping(value = "/messages/video-note"' "$CONTROLLER"
          ! grep -F '@PostMapping(value = "/messages/document"' "$CONTROLLER"
          ! grep -F '@PostMapping(value = "/messages/audio"' "$CONTROLLER"

          test ! -e src/main/java/gru/app/websocket/ChatHandler.java
          test ! -e src/main/java/gru/app/websocket/WebSocketController.java
          test ! -e src/main/java/gru/app/websocket/WebSocketHandler.java
