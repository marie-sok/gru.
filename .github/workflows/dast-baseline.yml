name: DAST baseline

on:
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/dast-baseline.yml"
      - ".zap/**"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: "8081"
      MONGODB_URI: "mongodb://127.0.0.1:27017/gru_dast"
      GRU_JWT_SECRET: "ci-only-gru-dast-secret-0123456789abcdef0123456789abcdef"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start exact PR backend
        shell: bash
        run: |
          set -euo pipefail

          mvn --batch-mode --no-transfer-progress spring-boot:run \
            > "$RUNNER_TEMP/gru-dast-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gru-dast-backend.pid"

          for attempt in $(seq 1 48); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "http://127.0.0.1:8081/actuator/health" >/dev/null; then
              echo "PR backend is healthy for DAST"
              exit 0
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/gru-dast-backend.pid")" 2>/dev/null; then
              echo "Backend exited before becoming healthy" >&2
              cat "$RUNNER_TEMP/gru-dast-backend.log" >&2
              exit 1
            fi

            sleep 3
          done

          echo "Backend did not become healthy in time" >&2
          cat "$RUNNER_TEMP/gru-dast-backend.log" >&2
          exit 1

      - name: OWASP ZAP baseline gate against PR backend
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8081"
          rules_file_name: ".zap/rules-local.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: "gru-zap-pr-gate"
          cmd_options: "-a -m 1 -T 5"

      - name: Stop PR backend
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gru-dast-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/gru-dast-backend.pid")" 2>/dev/null || true
          fi

  zap-production-baseline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wake production backend and wait for health
        shell: bash
        run: |
          set -euo pipefail
          TARGET="https://gru-jiqi.onrender.com"

          for attempt in $(seq 1 36); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$TARGET/health" >/dev/null; then
              echo "GRU production backend is awake for DAST"
              exit 0
            fi

            echo "Waiting for Render backend (attempt $attempt/36)..."
            sleep 5
          done

          echo "Production backend did not become healthy in time" >&2
          exit 1

      - name: OWASP ZAP baseline against public production surface
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://gru-jiqi.onrender.com"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "gru-zap-production-baseline"
          cmd_options: "-a -m 1 -T 5"
