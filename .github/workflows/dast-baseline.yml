name: DAST baseline

on:
  pull_request:
    paths:
      - ".github/workflows/dast-baseline.yml"
      - ".zap/**"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: OWASP ZAP baseline against public production surface
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://gru-jiqi.onrender.com"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "gru-zap-baseline"
          cmd_options: "-a -m 1"
