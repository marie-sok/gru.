name: iOS build

on:
  push:
    branches:
      - beta/0.9.0
      - beta/0.9.1-max
      - beta/0.9.2-rc
  pull_request:
    paths:
      - "swiftui/GRU/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned Simulator app
        run: |
          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/GRUDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release for physical iPhone architecture
        run: |
          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/GRUReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify TestFlight production transport
        run: |
          APP="$RUNNER_TEMP/GRUReleaseDerivedData/Build/Products/Release-iphoneos/gru.app"
          INFO="$APP/Info.plist"
          EN="$APP/en.lproj/InfoPlist.strings"
          RU="$APP/ru.lproj/InfoPlist.strings"

          test -f "$INFO"
          test -f "$EN"
          test -f "$RU"

          HTTP_EN="$(plutil -extract GRUProductionHTTPBaseURL raw "$EN")"
          WSS_EN="$(plutil -extract GRUProductionWebSocketURL raw "$EN")"
          HTTP_RU="$(plutil -extract GRUProductionHTTPBaseURL raw "$RU")"
          WSS_RU="$(plutil -extract GRUProductionWebSocketURL raw "$RU")"

          echo "EN HTTP=$HTTP_EN"
          echo "EN WSS=$WSS_EN"
          echo "RU HTTP=$HTTP_RU"
          echo "RU WSS=$WSS_RU"

          test "$HTTP_EN" = "https://gru-jiqi.onrender.com"
          test "$WSS_EN" = "wss://gru-jiqi.onrender.com/ws"
          test "$HTTP_RU" = "https://gru-jiqi.onrender.com"
          test "$WSS_RU" = "wss://gru-jiqi.onrender.com/ws"
