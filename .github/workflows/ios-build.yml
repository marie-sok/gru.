name: iOS build

on:
  push:
    branches:
      - beta/0.9.0
      - beta/0.9.1-max
      - beta/0.9.2-rc
  pull_request:
    paths:
      - "swiftui/GRU/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned Simulator app
        run: |
          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/GRUDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
