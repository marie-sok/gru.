name: iOS build

on:
  push:
    branches:
      - beta/0.9.0
      - beta/0.9.1-max
      - beta/0.9.2-rc
  pull_request:
    paths:
      - "swiftui/GRU/**"
      - ".github/scripts/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run dual-client E2EE v2 crypto smoke
        run: |
          xcrun swift .github/scripts/e2ee_v2_dual_client_smoke.swift
          grep -F 'static let protocolVersion = "gru-e2ee-v2"' \
            'swiftui/GRU/gru./Security/GRUE2EEV2.swift'
          grep -F '"sender-recovery"' \
            'swiftui/GRU/gru./Security/GRUE2EEV2.swift'

      - name: Build unsigned Simulator app
        run: |
          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/GRUDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release for physical iPhone architecture
        run: |
          xcodebuild \
            -project swiftui/GRU/gru..xcodeproj \
            -scheme gru \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/GRUReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify direct-chat E2EE transport is fail-closed
        run: |
          MESSAGE_API="swiftui/GRU/gru./Services/MessageAPIService.swift"
          E2EE_API="swiftui/GRU/gru./Services/E2EEAPIService.swift"
          MEDIA_API="swiftui/GRU/gru./Services/E2EEMediaService.swift"

          grep -F 'E2EEAPIService.shared.sendEncryptedText' "$MESSAGE_API"
          grep -F 'E2EEMediaService.shared.send' "$MESSAGE_API"
          grep -F 'path: "/messages/e2ee"' "$E2EE_API"
          grep -F 'path: "/messages/media-e2ee"' "$MEDIA_API"
          grep -F 'GRUE2EEV2.shared.encrypt' "$E2EE_API"
          grep -F 'GRUE2EEV2.shared.encrypt' "$MEDIA_API"

          # Normal direct-chat iOS sends must not regress to legacy plaintext routes.
          ! grep -F 'path: "/messages/photo"' "$MESSAGE_API"
          ! grep -F 'path: "/messages/video"' "$MESSAGE_API"
          ! grep -F 'path: "/messages/video-note"' "$MESSAGE_API"
          ! grep -F 'path: "/messages/document"' "$MESSAGE_API"
          ! grep -F 'path: "/messages/audio"' "$MESSAGE_API"
          ! grep -F 'path: "/messages",' "$MESSAGE_API"

      - name: Verify TestFlight production transport fail-safe
        run: |
          CONFIG="swiftui/GRU/gru./Services/APIClient.swift"
          APP="$RUNNER_TEMP/GRUReleaseDerivedData/Build/Products/Release-iphoneos/gru.app"

          test -d "$APP"
          grep -F 'private static let defaultProductionHTTPBaseURL = "https://gru-jiqi.onrender.com"' "$CONFIG"
          grep -F 'private static let defaultProductionWebSocketURL = "wss://gru-jiqi.onrender.com/ws"' "$CONFIG"
          grep -F '#if !DEBUG' "$CONFIG"
          grep -F 'return productionHTTPBaseURL' "$CONFIG"
          grep -F 'return productionWebSocketURL' "$CONFIG"

          # Release must have an HTTPS/WSS source-level fallback even if custom
          # Info.plist keys are absent from an archived product.
          ! grep -F 'Release • production URL not configured' "$CONFIG"
